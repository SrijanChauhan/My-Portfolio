  <text x="30" y="42" font-family="Switzer, Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="600" font-size="15" letter-spacing="0.04em" fill="#F2F1EC">DROOMPAY</text>
  <text x="30" y="60" font-family="Switzer, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" letter-spacing="0.06em" fill="#9BA3AD">CHECKOUT REDESIGN</text>

  <g transform="translate(140,90)">
